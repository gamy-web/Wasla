<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0757d5">
<title>وصلة | كل خدماتك في مكان واحد</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Tahoma,Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#f3f6fb;
color:#182238;
min-height:100vh;
}

button,input,select{
font-family:inherit;
}

button{
cursor:pointer;
border:0;
}

.app{
width:100%;
max-width:520px;
margin:auto;
min-height:100vh;
padding-bottom:92px;
}

/* HEADER */

.header{
background:linear-gradient(145deg,#0871f9,#06358e);
color:white;
padding:18px 16px 27px;
border-radius:0 0 32px 32px;
box-shadow:0 8px 30px rgba(4,70,170,.25);
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-icon{
width:45px;
height:45px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.18);
font-size:25px;
box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}

.brand-name{
font-size:26px;
font-weight:900;
}

.profile-button{
width:45px;
height:45px;
border-radius:50%;
background:rgba(255,255,255,.16);
color:white;
font-size:22px;
}

.greeting{
font-size:13px;
opacity:.88;
margin-bottom:6px;
}

.header-title{
font-size:25px;
font-weight:900;
line-height:1.4;
margin-bottom:18px;
}

.balance-card{
background:linear-gradient(
135deg,
rgba(255,255,255,.18),
rgba(255,255,255,.08)
);
border:1px solid rgba(255,255,255,.22);
border-radius:23px;
padding:18px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}

.balance-label{
font-size:13px;
opacity:.82;
}

.balance-value{
font-size:34px;
font-weight:900;
margin:6px 0 17px;
}

.balance-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.balance-actions button{
padding:12px 8px;
border-radius:14px;
font-weight:bold;
font-size:13px;
}

.recharge-btn{
background:white;
color:#0757d5;
}

.history-btn{
background:rgba(255,255,255,.13);
border:1px solid rgba(255,255,255,.25);
color:white;
}

/* MAIN */

.main{
padding:20px 14px;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:13px;
}

.section-head h2{
font-size:19px;
}

.section-head button{
background:none;
color:#0757d5;
font-size:12px;
}

/* SERVICES */

.services{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.service{
background:white;
border-radius:19px;
padding:13px 4px;
text-align:center;
box-shadow:0 5px 20px rgba(30,60,100,.07);
transition:.15s;
}

.service:active{
transform:scale(.94);
}

.service-icon{
width:49px;
height:49px;
margin:auto auto 8px;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
background:#edf4ff;
font-size:23px;
}

.service-name{
font-size:11px;
font-weight:bold;
line-height:1.4;
}

/* QUICK */

.quick{
margin-top:25px;
}

.quick-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
}

.quick-card{
background:white;
border-radius:19px;
padding:15px;
display:flex;
align-items:center;
gap:11px;
box-shadow:0 5px 20px rgba(30,60,100,.07);
}

.quick-icon{
width:46px;
height:46px;
flex:none;
border-radius:14px;
background:#edf4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
}

.quick-card strong{
display:block;
font-size:13px;
margin-bottom:4px;
}

.quick-card small{
font-size:10px;
color:#8a94a5;
}

/* OFFER */

.offer{
margin-top:24px;
padding:20px;
border-radius:22px;
color:white;
background:linear-gradient(135deg,#0b68ed,#123e9c);
position:relative;
overflow:hidden;
box-shadow:0 10px 25px rgba(4,70,170,.18);
}

.offer:after{
content:"";
position:absolute;
width:150px;
height:150px;
border-radius:50%;
left:-50px;
top:-60px;
background:rgba(255,255,255,.08);
}

.offer h3{
font-size:19px;
margin-bottom:7px;
}

.offer p{
font-size:11px;
opacity:.88;
margin-bottom:13px;
}

.offer button{
background:white;
color:#0757d5;
padding:10px 16px;
border-radius:12px;
font-weight:bold;
font-size:12px;
}

/* TRANSACTIONS */

.transactions{
margin-top:25px;
}

.transaction{
background:white;
border-radius:17px;
padding:13px;
margin-bottom:9px;
display:flex;
align-items:center;
gap:11px;
box-shadow:0 4px 15px rgba(30,60,100,.05);
}

.transaction-icon{
width:44px;
height:44px;
border-radius:13px;
background:#edf4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.transaction-info{
flex:1;
min-width:0;
}

.transaction-title{
font-size:13px;
font-weight:bold;
margin-bottom:4px;
}

.transaction-date{
font-size:9px;
color:#8a94a5;
}

.transaction-amount{
font-size:12px;
font-weight:bold;
}

.positive{
color:#0a9a58;
}

.negative{
color:#df3c3c;
}

.empty{
background:white;
padding:25px 15px;
border-radius:18px;
text-align:center;
color:#8a94a5;
font-size:12px;
}

/* BOTTOM NAV */

.bottom-nav{
position:fixed;
z-index:100;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
background:rgba(255,255,255,.97);
border-top:1px solid #e5e9ef;
display:grid;
grid-template-columns:repeat(5,1fr);
padding:8px 4px calc(8px + env(safe-area-inset-bottom));
backdrop-filter:blur(15px);
}

.nav-item{
background:none;
color:#8a94a5;
font-size:9px;
font-weight:bold;
}

.nav-icon{
display:block;
font-size:20px;
margin-bottom:3px;
}

.nav-item.active{
color:#0757d5;
}

/* MODAL */

.modal{
position:fixed;
z-index:200;
inset:0;
background:rgba(8,20,40,.57);
display:none;
align-items:flex-end;
justify-content:center;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
max-height:91vh;
overflow:auto;
background:#fff;
border-radius:28px 28px 0 0;
padding:20px 17px 30px;
animation:up .22s ease;
}

@keyframes up{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.modal-title{
font-size:19px;
font-weight:900;
}

.close{
width:36px;
height:36px;
border-radius:50%;
background:#f0f3f7;
color:#555;
font-size:16px;
}

/* FORMS */

.form-group{
margin-bottom:13px;
}

.form-group label{
display:block;
font-size:11px;
font-weight:bold;
margin-bottom:7px;
}

.form-group input,
.form-group select{
width:100%;
padding:13px;
border-radius:13px;
border:1px solid #dfe4eb;
background:#fafbfd;
outline:none;
font-size:13px;
}

.form-group input:focus,
.form-group select:focus{
border-color:#0757d5;
}

.primary{
width:100%;
padding:14px;
border-radius:13px;
background:#0757d5;
color:white;
font-weight:bold;
font-size:13px;
}

.secondary{
width:100%;
padding:13px;
border-radius:13px;
background:#eef2f7;
color:#263449;
font-weight:bold;
margin-top:9px;
font-size:13px;
}

/* PROFILE */

.profile-top{
text-align:center;
padding:8px 0 18px;
}

.avatar{
width:76px;
height:76px;
margin:auto auto 10px;
border-radius:50%;
background:#eaf2ff;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
}

.profile-name{
font-size:18px;
font-weight:bold;
}

.profile-email{
font-size:11px;
color:#8a94a5;
margin-top:4px;
}

/* NOTIFICATION */

.toast{
position:fixed;
z-index:500;
bottom:100px;
left:50%;
transform:translate(-50%,20px);
background:#172033;
color:white;
padding:12px 17px;
border-radius:13px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.25s;
max-width:90%;
text-align:center;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

/* LOGIN */

.login-box{
text-align:center;
padding:5px 0;
}

.login-logo{
width:70px;
height:70px;
border-radius:22px;
background:linear-gradient(135deg,#0871f9,#06358e);
color:white;
font-size:35px;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 13px;
}

.login-box p{
font-size:11px;
color:#8993a3;
margin-bottom:18px;
}

/* CONFIRM */

.confirm-icon{
width:65px;
height:65px;
margin:5px auto 12px;
border-radius:20px;
background:#edf4ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-align:center;
}

.confirm-text{
text-align:center;
font-size:13px;
line-height:1.8;
margin-bottom:16px;
}

.confirm-amount{
font-size:24px;
font-weight:900;
color:#0757d5;
margin:8px 0;
}

@media(max-width:370px){
.services{
grid-template-columns:repeat(3,1fr);
}
.balance-value{
font-size:29px;
}
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="topbar">

<div class="brand">
<div class="brand-icon">🔗</div>
<div class="brand-name">وصلة</div>
</div>

<button class="profile-button" onclick="openProfile()">👤</button>

</div>

<div class="greeting" id="greeting">
أهلاً بك 👋
</div>

<div class="header-title">
كل خدماتك في مكان واحد
</div>

<div class="balance-card">

<div class="balance-label">
الرصيد المتاح
</div>

<div class="balance-value" id="balance">
0.00 ج.م
</div>

<div class="balance-actions">

<button class="recharge-btn" onclick="openTopup()">
＋ شحن الرصيد
</button>

<button class="history-btn" onclick="showTransactions()">
📋 العمليات
</button>

</div>

</div>

</header>

<main class="main">

<div class="section-head">
<h2>الخدمات</h2>
<button onclick="showAllServices()">عرض الكل</button>
</div>

<div class="services">

<div class="service" onclick="openService('mobile')">
<div class="service-icon">📱</div>
<div class="service-name">شحن رصيد</div>
</div>

<div class="service" onclick="openService('internet')">
<div class="service-icon">🌐</div>
<div class="service-name">باقات إنترنت</div>
</div>

<div class="service" onclick="openService('electricity')">
<div class="service-icon">⚡</div>
<div class="service-name">كهرباء</div>
</div>

<div class="service" onclick="openService('water')">
<div class="service-icon">💧</div>
<div class="service-name">مياه</div>
</div>

<div class="service" onclick="openService('gas')">
<div class="service-icon">🔥</div>
<div class="service-name">غاز</div>
</div>

<div class="service" onclick="openService('transport')">
<div class="service-icon">🚌</div>
<div class="service-name">مواصلات</div>
</div>

<div class="service" onclick="openService('entertainment')">
<div class="service-icon">🎬</div>
<div class="service-name">ترفيه</div>
</div>

<div class="service" onclick="openService('phone')">
<div class="service-icon">☎️</div>
<div class="service-name">تليفون</div>
</div>

</div>

<section class="quick">

<div class="section-head">
<h2>وصول سريع</h2>
</div>

<div class="quick-grid">

<div class="quick-card" onclick="openTopup()">
<div class="quick-icon">💳</div>
<div>
<strong>شحن المحفظة</strong>
<small>إضافة رصيد تجريبي</small>
</div>
</div>

<div class="quick-card" onclick="showTransactions()">
<div class="quick-icon">🧾</div>
<div>
<strong>الفواتير</strong>
<small>سجل عملياتك</small>
</div>
</div>

</div>

</section>

<section class="offer">

<h3>🎁 عروض وصلة</h3>

<p>
العروض والمكافآت ستظهر هنا عند تفعيلها.
</p>

<button onclick="showToast('العروض ستتوفر قريبًا 🎁')">
اكتشف العروض
</button>

</section>

<section class="transactions">

<div class="section-head">
<h2>آخر العمليات</h2>
<button onclick="showTransactions()">عرض الكل</button>
</div>

<div id="transactionsList"></div>

</section>

</main>

</div>


<nav class="bottom-nav">

<button class="nav-item active" onclick="homeNav(this)">
<span class="nav-icon">🏠</span>
الرئيسية
</button>

<button class="nav-item" onclick="paymentsNav(this)">
<span class="nav-icon">💳</span>
الدفع
</button>

<button class="nav-item" onclick="transactionsNav(this)">
<span class="nav-icon">📋</span>
العمليات
</button>

<button class="nav-item" onclick="walletNav(this)">
<span class="nav-icon">💰</span>
المحفظة
</button>

<button class="nav-item" onclick="profileNav(this)">
<span class="nav-icon">👤</span>
حسابي
</button>

</nav>


<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-head">

<div class="modal-title" id="modalTitle">
وصلة
</div>

<button class="close" onclick="closeModal()">✕</button>

</div>

<div id="modalContent"></div>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================
   DATA
========================= */

let balance = Number(localStorage.getItem("wasla_balance") || 0);

let transactions =
JSON.parse(localStorage.getItem("wasla_transactions") || "[]");

let user =
JSON.parse(localStorage.getItem("wasla_user") || "null");


/* =========================
   SERVICES
========================= */

const services = {

mobile:{
title:"📱 شحن رصيد",
icon:"📱",
fields:`

<div class="form-group">
<label>رقم الهاتف</label>
<input id="phone" type="tel" placeholder="01xxxxxxxxx">
</div>

<div class="form-group">
<label>الشبكة</label>
<select>
<option>فودافون</option>
<option>أورنج</option>
<option>اتصالات</option>
<option>WE</option>
</select>
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="amount" type="number" placeholder="مثال: 50">
</div>

<button class="primary"
onclick="preparePayment('شحن رصيد','📱')">
متابعة الدفع
</button>
`
},

internet:{
title:"🌐 باقات الإنترنت",
icon:"🌐",
fields:`

<div class="form-group">
<label>رقم الهاتف</label>
<input id="phone" type="tel" placeholder="01xxxxxxxxx">
</div>

<div class="form-group">
<label>الشبكة</label>
<select>
<option>فودافون</option>
<option>أورنج</option>
<option>اتصالات</option>
<option>WE</option>
</select>
</div>

<div class="form-group">
<label>الباقة</label>
<select id="amount">
<option value="30">باقة 30 جنيه</option>
<option value="50">باقة 50 جنيه</option>
<option value="100">باقة 100 جنيه</option>
<option value="200">باقة 200 جنيه</option>
</select>
</div>

<button class="primary"
onclick="preparePayment('باقة إنترنت','🌐')">
متابعة الدفع
</button>
`
},

electricity:{
title:"⚡ الكهرباء",
icon:"⚡",
fields:`

<div class="form-group">
<label>رقم العداد أو كود الدفع</label>
<input id="customer" type="text" placeholder="أدخل الرقم">
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="amount" type="number" placeholder="المبلغ">
</div>

<button class="primary"
onclick="preparePayment('فاتورة كهرباء','⚡')">
متابعة الدفع
</button>
`
},

water:{
title:"💧 المياه",
icon:"💧",
fields:`

<div class="form-group">
<label>رقم المشترك</label>
<input id="customer" type="text" placeholder="رقم المشترك">
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="amount" type="number" placeholder="المبلغ">
</div>

<button class="primary"
onclick="preparePayment('فاتورة مياه','💧')">
متابعة الدفع
</button>
`
},

gas:{
title:"🔥 الغاز",
icon:"🔥",
fields:`

<div class="form-group">
<label>رقم المشترك</label>
<input id="customer" type="text" placeholder="رقم المشترك">
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="amount" type="number" placeholder="المبلغ">
</div>

<button class="primary"
onclick="preparePayment('فاتورة غاز','🔥')">
متابعة الدفع
</button>
`
},

transport:{
title:"🚌 المواصلات",
icon:"🚌",
fields:`

<div class="form-group">
<label>الخدمة</label>
<select>
<option>تذكرة مواصلات</option>
<option>شحن كارت مواصلات</option>
<option>خدمة نقل</option>
</select>
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="amount" type="number" placeholder="المبلغ">
</div>

<button class="primary"
onclick="preparePayment('مواصلات','🚌')">
متابعة الدفع
</button>
`
},

entertainment:{
title:"🎬 الترفيه",
icon:"🎬",
fields:`

<div class="form-group">
<label>الخدمة</label>
<select>
<option>اشتراك ترفيهي</option>
<option>محتوى رقمي</option>
<option>ألعاب</option>
</select>
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="amount" type="number" placeholder="المبلغ">
</div>

<button class="primary"
onclick="preparePayment('محتوى ترفيهي','🎬')">
متابعة الدفع
</button>
`
},

phone:{
title:"☎️ التليفون والإنترنت",
icon:"☎️",
fields:`

<div class="form-group">
<label>رقم الخدمة</label>
<input id="customer" type="text" placeholder="رقم الخدمة">
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="amount" type="number" placeholder="المبلغ">
</div>

<button class="primary"
onclick="preparePayment('فاتورة تليفون وإنترنت','☎️')">
متابعة الدفع
</button>
`
}

};


/* =========================
   STORAGE
========================= */

function saveData(){

localStorage.setItem(
"wasla_balance",
balance
);

localStorage.setItem(
"wasla_transactions",
JSON.stringify(transactions)
);

localStorage.setItem(
"wasla_user",
JSON.stringify(user)
);

}


/* =========================
   MODAL
========================= */

function openModal(title,content){

document.getElementById("modalTitle").textContent=title;

document.getElementById("modalContent").innerHTML=content;

document.getElementById("modal").classList.add("show");

}

function closeModal(){

document.getElementById("modal").classList.remove("show");

}

document.getElementById("modal").addEventListener(
"click",
function(e){

if(e.target===this){
closeModal();
}

}
);


/* =========================
   SERVICE
========================= */

function openService(type){

if(!services[type]) return;

openModal(
services[type].title,
services[type].fields
);

}


/* =========================
   TOP UP
========================= */

function openTopup(){

openModal(
"💳 شحن الرصيد",
`

<div style="
background:#edf4ff;
border-radius:16px;
padding:15px;
margin-bottom:15px;
text-align:center;
">

<div style="font-size:11px;color:#778399">
الرصيد الحالي
</div>

<div style="
font-size:25px;
font-weight:900;
color:#0757d5;
margin-top:5px;
">
${money(balance)}
</div>

</div>

<div class="form-group">
<label>مبلغ الشحن</label>
<input id="topupAmount"
type="number"
placeholder="مثال: 100">
</div>

<div class="form-group">
<label>طريقة الشحن</label>
<select>
<option>بطاقة بنكية - تجريبي</option>
<option>محفظة إلكترونية - تجريبي</option>
<option>بطاقة دفع - تجريبي</option>
</select>
</div>

<button class="primary"
onclick="confirmTopup()">
شحن الرصيد
</button>

<div style="
font-size:10px;
color:#8993a3;
text-align:center;
margin-top:10px;
">
هذه عملية تجريبية وليست عملية مالية حقيقية.
</div>
`
);

}

function confirmTopup(){

const value=Number(
document.getElementById("topupAmount").value
);

if(!value || value<=0){

showToast("اكتب مبلغًا صحيحًا");

return;

}

if(value>10000){

showToast("المبلغ التجريبي الأقصى 10000 جنيه");

return;

}

balance+=value;

addTransaction(
"💳",
"شحن الرصيد",
value
);

saveData();

updateUI();

closeModal();

showToast(
"تم شحن الرصيد تجريبيًا ✅"
);

}


/* =========================
   PAYMENT
========================= */

function preparePayment(title,icon){

const amountElement=
document.getElementById("amount");

if(!amountElement){

showToast("تأكد من إدخال البيانات");

return;

}

const amount=Number(amountElement.value);

if(!amount || amount<=0){

showToast("أدخل مبلغًا صحيحًا");

return;

}

if(amount>balance){

showToast(
"الرصيد غير كافٍ. اشحن محفظتك أولاً."
);

return;

}

openModal(
"تأكيد العملية",
`

<div class="confirm-icon">
${icon}
</div>

<div class="confirm-text">

<div>
هل تريد تنفيذ العملية التالية؟
</div>

<strong>
${title}
</strong>

<div class="confirm-amount">
${money(amount)}
</div>

<div style="
font-size:10px;
color:#8993a3;
">
سيتم خصم المبلغ من الرصيد التجريبي.
</div>

</div>

<button class="primary"
onclick="completePayment('${escapeText(title)}','${icon}',${amount})">
تأكيد العملية
</button>

<button class="secondary"
onclick="closeModal()">
رجوع
</button>
`
);

}

function completePayment(title,icon,amount){

if(amount>balance){

closeModal();

showToast("الرصيد غير كافٍ");

return;

}

balance-=amount;

addTransaction(
icon,
title,
-amount
);

saveData();

updateUI();

closeModal();

showToast(
"تم تسجيل العملية بنجاح ✅"
);

}


/* =========================
   TRANSACTIONS
========================= */

function addTransaction(icon,title,amount){

transactions.unshift({

icon:icon,

title:title,

amount:amount,

date:new Date().toLocaleString(
"ar-EG"
)

});

if(transactions.length>50){

transactions=transactions.slice(0,50);

}

saveData();

renderTransactions();

}

function renderTransactions(){

const list=
document.getElementById(
"transactionsList"
);

if(!transactions.length){

list.innerHTML=`
<div class="empty">
لا توجد عمليات حتى الآن 📋
</div>
`;

return;

}

list.innerHTML=
transactions
.slice(0,5)
.map(transactionHTML)
.join("");

}

function transactionHTML(t){

const positive=t.amount>=0;

return `

<div class="transaction">

<div class="transaction-icon">
${t.icon}
</div>

<div class="transaction-info">

<div class="transaction-title">
${escapeHTML(t.title)}
</div>

<div class="transaction-date">
${escapeHTML(t.date)}
</div>

</div>

<div class="
transaction-amount
${positive?"positive":"negative"}
">

${positive?"+":""}${money(t.amount)}

</div>

</div>

`;

}

function showTransactions(){

let content="";

if(!transactions.length){

content=`
<div class="empty">
لا توجد عمليات حتى الآن 📋
</div>
`;

}else{

content=
transactions
.map(transactionHTML)
.join("");

}

openModal(
"📋 سجل العمليات",
content
);

}

"balance"

function money(value){

return Number(value)
.toFixed(2)+" ج.م";

}


/* =========================
   HELPERS
========================= */

function showAllServices(){

window.scrollTo({
top:document.querySelector(".services").offsetTop-80,
behavior:"smooth"
});

showToast(
"كل خدمات وصلة موجودة هنا 👇"
);

}

function showToast(message){

const toast=
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

clearTimeout(
window.waslaToastTimer
);

window.waslaToastTimer=
setTimeout(()=>{
toast.classList.remove("show");
},2500);

}

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeText(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}
